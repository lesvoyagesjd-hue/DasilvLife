const { useState, useEffect, useRef } = React;

function getMonday(d) {
  const date = new Date(d);
  const day = date.getDay();
  const diff = date.getDate() - day + (day === 0 ? -6 : 1);
  date.setDate(diff);
  date.setHours(0,0,0,0);
  return date;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtDateFr(d) {
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
function useLocalStorage(key, def) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; }
    catch { return def; }
  });
  useEffect(() => { localStorage.setItem(key, JSON.stringify(val)); }, [key, val]);
  return [val, setVal];
}

// ── Base de données partagée (Firebase Firestore) ─────────────────────────────
function useSharedState(key, defaultValue) {
  const [val, setVal] = useState(() => {
    // Initialisation instantanée depuis le cache local
    try { const s = localStorage.getItem('fs_' + key); return s ? JSON.parse(s) : defaultValue; }
    catch { return defaultValue; }
  });

  useEffect(() => {
    // Écoute les changements en temps réel (sync entre téléphones)
    const unsub = window._db.collection('maVie').doc(key).onSnapshot(
      snap => {
        if (snap.exists) {
          const remote = snap.data().v;
          setVal(remote);
          try { localStorage.setItem('fs_' + key, JSON.stringify(remote)); } catch {}
        }
      },
      err => console.warn('[Firestore]', key, err.message)
    );
    return unsub;
  }, [key]);

  function setShared(newVal) {
    setVal(prev => {
      const next = typeof newVal === 'function' ? newVal(prev) : newVal;
      Promise.resolve().then(() => {
        try { localStorage.setItem('fs_' + key, JSON.stringify(next)); } catch {}
        window._db.collection('maVie').doc(key).set({ v: next })
          .catch(e => console.warn('[Firestore write]', e.message));
      });
      return next;
    });
  }

  return [val, setShared];
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

}

function Dashboard({ meals, crecheSchedule, setCrecheSchedule, trips, shoppingItems, settings, setTab, photos, anniversaires, notes, domotiqueConfig, domotiqueStates, onOpenSettings, profile, sport }) {
  const today = new Date();
  const todayKey = fmtDate(today);
  const todayMeals = meals[todayKey] || {};
  const todayCreche = crecheSchedule[todayKey] || {};
  const upcoming = trips.filter(t => new Date(t.startDate) >= today).sort((a,b) => new Date(a.startDate)-new Date(b.startDate)).slice(0,3);
  const unchecked = shoppingItems.filter(i => !i.checked);

  // Sport — objectif semaine
  const sportSessions = sport?.sessions || [];
  const sportGoal     = sport?.weeklyGoal || 3;
  const getMonday = d => { const r=new Date(d); const day=r.getDay(); r.setDate(r.getDate()-day+(day===0?-6:1)); r.setHours(0,0,0,0); return r; };

  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  const sportThisWeek = sportSessions.filter(s => { const d=new Date(s.date); return d>=monday && d<=sunday; });
  const sportPct = Math.min(100, Math.round((sportThisWeek.length / sportGoal) * 100));
  const sportDone = sportThisWeek.length >= sportGoal;

    <div className="space-y-5 fade-in">
      <div>

        <h2 className="text-2xl font-bold text-slate-800">Bonjour {(PROFILES[profile] || PROFILES.damien).name} 👋</h2>

      {/* Bloc motivation — Damien uniquement */}
      {profile !== 'jessica' && (() => {
        const dayOfYear = Math.floor((today - new Date(today.getFullYear(),0,0)) / 86400000);
        const quote = DAILY_QUOTES[dayOfYear % DAILY_QUOTES.length];
        return (
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 border-l-4" style={{borderLeftColor:'#6366f1'}}>
            <p className="text-sm text-slate-700 italic leading-relaxed">« {quote.text} »</p>
            <p className="text-xs text-slate-400 mt-2 text-right">— {quote.source}</p>
          </div>
        );
      })()}

      {/* Widget objectif sport — Damien uniquement */}
      {profile !== 'jessica' && sport && (
        <button onClick={() => setTab('sport')} className="w-full text-left">
          <div className={`rounded-2xl p-4 shadow-sm border ${sportDone ? 'bg-green-50 border-green-200' : 'bg-white border-slate-100'}`}>
            <div className="flex items-center justify-between mb-2">
              <span className="font-semibold text-slate-700">🏋️ Objectif sport</span>
              <span className={`text-sm font-bold ${sportDone ? 'text-green-600' : 'text-indigo-600'}`}>{sportThisWeek.length}/{sportGoal} séances</span>
            </div>
            <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
              <div className="h-2 rounded-full transition-all duration-500" style={{width:`${sportPct}%`, backgroundColor: sportDone ? '#22c55e' : '#6366f1'}} />
            </div>
            {sportDone
              ? <p className="text-xs text-green-600 font-medium mt-1.5">🎉 Objectif atteint cette semaine !</p>
              : <p className="text-xs text-slate-400 mt-1.5">{sportGoal - sportThisWeek.length} séance{sportGoal-sportThisWeek.length>1?'s':''} restante{sportGoal-sportThisWeek.length>1?'s':''} cette semaine</p>
            }
          </div>
        </button>
      )}

      {/* Dîner du jour — affiché seulement si rempli */}
      {todayMeals['Dîner'] && (
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-semibold text-slate-700">🌙 Ce soir on mange</h3>
            <button onClick={() => setTab('meals')} className="text-xs text-indigo-500 hover:underline">Voir semainier →</button>
          </div>
          <div className="rounded-xl p-4 text-center bg-indigo-50 border border-indigo-200">
            <span className="text-base font-semibold text-indigo-800">{todayMeals['Dîner']}</span>
          </div>
        </div>
      )}

      {/* Crèche — affiché uniquement les jours pertinents */}
      {(() => {
        const dow = today.getDay(); // 0=dim, 1=lun, 2=mar, 3=mer, 4=jeu, 5=ven, 6=sam
        const isCrecheDay = [2,3,4].includes(dow); // mar, mer, jeu
        const isFriday = dow === 5;
        const todayStr = fmtDate(today);
        const todayTrip = trips.find(t => todayStr >= t.startDate && todayStr <= (t.endDate || t.startDate));

        // Masquer si c'est un jour sans crèche et sans voyage (lun, sam, dim)
        if (!isCrecheDay && !isFriday && !todayTrip) return null;

        const mamieDefault = getMamieForWeek(getMonday(today));
        const MAMIES = ['Mamie Guida', 'Mamie Lala'];
        const mamieDisplay = todayCreche.mamie || mamieDefault;
        const mamieOther = MAMIES.find(m => m !== mamieDisplay);

        function toggleMamie() {
          setCrecheSchedule(p => ({...p, [todayStr]: {...(p[todayStr]||{}), mamie: mamieOther}}));
        }

        return (
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-semibold text-slate-700">👶 {settings.childName} aujourd'hui</h3>
              <button onClick={() => setTab('creche')} className="text-xs text-indigo-500 hover:underline">Planning →</button>
            </div>
            {todayTrip ? (
              <div className="flex items-center gap-3 bg-purple-50 border border-purple-200 rounded-xl px-4 py-3">
                <span className="text-2xl">{todayTrip.emoji || '✈️'}</span>
                <div>
                  <div className="text-sm font-semibold text-purple-700">En voyage — {todayTrip.name}</div>
                  <div className="text-xs text-purple-500">Pas de crèche aujourd'hui</div>
                </div>
              </div>
            ) : isCrecheDay ? (
              <div className="flex gap-4">
                <div className="flex-1 rounded-xl p-3 bg-slate-50 text-center">
                  <div className="text-xs text-slate-500 mb-1">🌅 Dépôt</div>
                  {todayCreche.dropoff
                    ? <span className={`text-sm font-semibold px-2 py-0.5 rounded-full ${todayCreche.dropoff===settings.myName?'person-damien':'person-wife'}`}>{todayCreche.dropoff}</span>
                    : <span className="text-slate-300 text-sm">—</span>}
                </div>
                <div className="flex-1 rounded-xl p-3 bg-slate-50 text-center">
                  <div className="text-xs text-slate-500 mb-1">🌆 Récupération</div>
                  {todayCreche.pickup
                    ? <span className={`text-sm font-semibold px-2 py-0.5 rounded-full ${todayCreche.pickup===settings.myName?'person-damien':'person-wife'}`}>{todayCreche.pickup}</span>
                    : <span className="text-slate-300 text-sm">—</span>}
                </div>
              </div>
            ) : isFriday ? (
              <div className="flex items-center justify-between bg-green-50 border border-green-200 rounded-xl px-4 py-3">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">👵</span>
                  <div>
                    <div className="text-sm font-semibold text-green-700">Chez {mamieDisplay}</div>
                    <div className="text-xs text-green-500">Pas de crèche aujourd'hui</div>
                  </div>
                </div>
                <button onClick={toggleMamie} className="text-xs text-green-600 bg-green-100 hover:bg-green-200 px-2 py-1 rounded-lg transition-colors">
                  → {mamieOther}
                </button>
              </div>
            ) : null}
          </div>
        );
      })()}

      {/* Anniversaires à venir */}
      {anniversaires.length > 0 && (() => {
        const upcoming = [...anniversaires]
          .sort((a,b) => daysUntil(a.day,a.month) - daysUntil(b.day,b.month))
          .filter(a => daysUntil(a.day,a.month) <= 30)
          .slice(0,3);
        if (!upcoming.length) return null;
        return (
          <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
            <div className="flex items-center justify-between mb-3">
              <h3 className="font-semibold text-slate-700">🎂 Bientôt</h3>
              <button onClick={() => onOpenSettings && onOpenSettings()} className="text-xs text-indigo-500 hover:underline">Gérer →</button>
            </div>
            <div className="space-y-2">
              {upcoming.map(a => {
                const d = daysUntil(a.day, a.month);
                return (
                  <div key={a.id} className="flex items-center gap-3">
                    <span className="text-xl">{a.emoji}</span>
                    <span className="flex-1 text-sm text-slate-700 font-medium">{a.name}</span>
                    {d === 0
                      ? <span className="text-xs bg-indigo-600 text-white px-2 py-0.5 rounded-full font-bold">Aujourd'hui 🎉</span>
                      : <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${d<=7?'bg-rose-50 text-rose-600':'bg-slate-100 text-slate-500'}`}>J-{d}</span>}
                  </div>
                );
              })}
            </div>
          </div>
        );
      })()}

      {/* Notes épinglées */}
      {notes.filter(n => n.pinned).length > 0 && (
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-semibold text-slate-700">📌 Notes épinglées</h3>
            <button onClick={() => setTab('notes')} className="text-xs text-indigo-500 hover:underline">Toutes →</button>
          </div>
          <div className="space-y-2">
            {notes.filter(n=>n.pinned).slice(0,3).map(n => {
              const c = NOTE_COLORS[n.color] || NOTE_COLORS.yellow;
              return (
                <div key={n.id} className={`${c.bg} ${c.border} border rounded-xl px-3 py-2`}>
                  {n.title && <div className="text-xs font-semibold text-slate-700 mb-0.5">{n.title}</div>}
                  <div className="text-sm text-slate-600 line-clamp-2">{n.content}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Widget domotique */}
      {((domotiqueConfig?.vacuum?.enabled) || (domotiqueConfig?.plugs?.length > 0)) && (
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-semibold text-slate-700">🏠 Maison</h3>
            <button onClick={() => setTab('domotique')} className="text-xs text-indigo-500 hover:underline">Contrôler →</button>
          </div>
          <div className="flex flex-wrap gap-2">
            {domotiqueConfig?.vacuum?.enabled && (
              <div className="flex items-center gap-2 bg-slate-50 rounded-xl px-3 py-2">
                <span>🤖</span>
                <span className="text-xs font-medium text-slate-600">{domotiqueConfig.vacuum.name || 'MOVA'}</span>
                {domotiqueStates?.vacuum?.electricity !== undefined && (
                  <span className="text-xs text-slate-400">{domotiqueStates.vacuum.electricity}%🔋</span>
                )}
                <span className={`text-xs px-1.5 py-0.5 rounded-full ${domotiqueStates?.vacuum?.status === 'cleaning' ? 'bg-green-100 text-green-700' : 'bg-slate-100 text-slate-500'}`}>
                  {VACUUM_LABELS[domotiqueStates?.vacuum?.status] || '—'}
                </span>
              </div>
            )}
            {(domotiqueConfig?.plugs || []).map(plug => {
              const isOn = domotiqueStates?.[plug.id]?.on ?? false;
              return (
                <div key={plug.id} className={`flex items-center gap-2 rounded-xl px-3 py-2 ${isOn ? 'bg-amber-50 border border-amber-200' : 'bg-slate-50'}`}>
                  <span>{plug.icon || '💡'}</span>
                  <span className="text-xs font-medium text-slate-600 truncate max-w-20">{plug.name}</span>
                  <span className={`text-xs font-semibold ${isOn ? 'text-amber-600' : 'text-slate-400'}`}>{isOn ? '●' : '○'}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Voyages */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <div className="flex items-center justify-between mb-3">
          <h3 className="font-semibold text-slate-700">✈️ Prochains voyages</h3>
          <button onClick={() => setTab('trips')} className="text-xs text-indigo-500 hover:underline">Tous →</button>
        </div>
        {upcoming.length === 0
          ? <p className="text-slate-400 text-sm">Aucun voyage prévu. <button onClick={() => setTab('trips')} className="text-indigo-500 hover:underline">Ajouter →</button></p>
          : <div className="space-y-2">
              {upcoming.map(t => {
                const daysLeft = Math.ceil((new Date(t.startDate)-today)/86400000);
                return (
                  <div key={t.id} className="flex items-center gap-3 p-3 bg-slate-50 rounded-xl">
                    <span className="text-2xl">{t.emoji||'🗺️'}</span>
                    <div className="flex-1 min-w-0">
                      <div className="font-medium text-slate-800 truncate">{t.name}</div>
                      <div className="text-xs text-slate-500">{t.destination} · {new Date(t.startDate).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div>
                    </div>
                    <Pill color={daysLeft<=7?'rose':daysLeft<=30?'amber':'green'}>J-{daysLeft}</Pill>
                  </div>
                );
              })}
            </div>
        }
      </div>

      {/* Courses */}
      {unchecked.length > 0 && (
        <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
          <div className="flex items-center justify-between mb-3">
            <h3 className="font-semibold text-slate-700">🛒 À acheter ({unchecked.length})</h3>
            <button onClick={() => setTab('shopping')} className="text-xs text-indigo-500 hover:underline">Liste complète →</button>
          </div>
          <div className="flex flex-wrap gap-2">
            {unchecked.slice(0,6).map(i => <span key={i.id} className="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-lg">{i.name}</span>)}
            {unchecked.length>6 && <span className="text-xs text-slate-400">+{unchecked.length-6} autres</span>}
          </div>
        </div>
      )}

      {/* Widget Finance — masqué pour Jessica */}
      {profile !== 'jessica' && <FinanceWidget setTab={setTab} />}
    </div>
  );
}

// ── Semainier de repas ────────────────────────────────────────────────────────
function MealPlanner({ meals, setMeals, shoppingItems, setShoppingItems }) {
  const [weekStart, setWeekStart] = useState(getMonday(new Date()));
  const [modal, setModal] = useState(null); // {dateKey, meal}
  const [input, setInput] = useState('');
  const [ingredients, setIngredients] = useState('');

  const days = Array.from({length:7}, (_,i) => addDays(weekStart, i));

  function openSlot(dateKey) {
    setInput(meals[dateKey]?.['Dîner'] || '');
    setIngredients('');
    setModal({dateKey});
  }
  function saveMeal() {
    if (!modal) return;
    const {dateKey} = modal;
    setMeals(p => ({...p, [dateKey]: {...(p[dateKey]||{}), 'Dîner': input}}));
    if (ingredients.trim()) {
      const dayLabel = DAYS_FR[days.findIndex(d => fmtDate(d) === dateKey)];
      const newItems = ingredients.split(',').map(s => s.trim()).filter(Boolean).map(name => ({
        id: uid(), name, quantity:'', category:'Épicerie', checked:false, fromMeal:true, meal:`${dayLabel} soir`
      }));
      setShoppingItems(p => [...p, ...newItems]);
    }
    setModal(null);
  }
  function clearMeal(dateKey) {
    setMeals(p => {
      const next = {...p, [dateKey]: {...(p[dateKey]||{})}};
      delete next[dateKey]['Dîner'];
      return next;
    });
  }

  const fmtWeek = `${weekStart.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – ${addDays(weekStart,6).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}`;
  const modalDay = modal ? DAYS_FR[days.findIndex(d => fmtDate(d) === modal.dateKey)] : '';

  return (
    <div className="fade-in space-y-3">
      <div className="flex items-center justify-between mb-2">
        <h2 className="text-xl font-bold text-slate-800">🌙 Dîners de la semaine</h2>
        <div className="flex items-center gap-2">
          <button onClick={() => setWeekStart(p => addDays(p,-7))} className="p-2 rounded-lg hover:bg-slate-200 text-slate-600">◀</button>
          <span className="text-sm font-medium text-slate-600">{fmtWeek}</span>
          <button onClick={() => setWeekStart(p => addDays(p,7))} className="p-2 rounded-lg hover:bg-slate-200 text-slate-600">▶</button>
        </div>
      </div>

      {days.map((d, i) => {
        const dk = fmtDate(d);
        const val = meals[dk]?.['Dîner'];
        const isToday = dk === fmtDate(new Date());
        return (
          <div key={dk}
            onClick={() => openSlot(dk)}
            className={`flex items-center gap-4 p-4 rounded-2xl cursor-pointer transition-all border ${isToday ? 'border-indigo-300 ring-1 ring-indigo-200 bg-white' : 'bg-white border-slate-100 hover:border-indigo-200'}`}>
            <div className="w-20 flex-shrink-0">
              <div className={`text-sm font-semibold ${isToday ? 'text-indigo-600' : 'text-slate-700'}`}>{DAYS_FR[i]}</div>
              <div className="text-xs text-slate-400">{d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div>
            </div>
            <div className="flex-1">
              {val
                ? <span className="text-sm font-medium text-slate-800">{val}</span>
                : <span className="text-sm text-slate-300">Ajouter un plat...</span>}
            </div>
            {val
              ? <span className="text-xs bg-indigo-50 text-indigo-500 px-2 py-1 rounded-lg">✏️</span>
              : <span className="text-slate-300 text-lg">+</span>}
          </div>
        );
      })}

      <Modal open={!!modal} onClose={() => setModal(null)} title={`🌙 Dîner · ${modalDay}`}>
        <div className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Plat</label>
            <input autoFocus className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
              placeholder="Ex: Poulet rôti, Pasta bolognaise..."
              value={input} onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key==='Enter' && saveMeal()} />
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Ingrédients à acheter <span className="text-slate-400 font-normal">(optionnel, virgules)</span></label>
            <textarea className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none"
              rows={2} placeholder="Ex: 500g pâtes, boeuf haché, coulis tomate..."
              value={ingredients} onChange={e => setIngredients(e.target.value)} />
          </div>
          <div className="flex gap-2">
            <button onClick={saveMeal} className="flex-1 bg-indigo-600 text-white rounded-lg py-2 text-sm font-medium hover:bg-indigo-700">Enregistrer</button>
            {modal && meals[modal.dateKey]?.['Dîner'] && (
              <button onClick={() => { clearMeal(modal.dateKey); setModal(null); }}
                className="px-4 border border-rose-200 text-rose-500 rounded-lg py-2 text-sm hover:bg-rose-50">Supprimer</button>
            )}
          </div>
        </div>
      </Modal>
    </div>
  );
}

// ── Liste de courses ──────────────────────────────────────────────────────────
function ShoppingList({ shoppingItems, setShoppingItems }) {
  const [form, setForm] = useState({name:'',quantity:'',category:'Épicerie'});
  const [filter, setFilter] = useState('all');

  function addItem() {
    if (!form.name.trim()) return;
    setShoppingItems(p => [...p, {id:uid(), ...form, checked:false, fromMeal:false}]);
    setForm(p => ({...p, name:'', quantity:''}));
  }
  function toggle(id) { setShoppingItems(p => p.map(i => i.id===id ? {...i,checked:!i.checked} : i)); }
  function remove(id) { setShoppingItems(p => p.filter(i => i.id!==id)); }
  function clearChecked() { setShoppingItems(p => p.filter(i => !i.checked)); }

  const grouped = CATEGORIES.reduce((acc,cat) => {
    const items = shoppingItems.filter(i => i.category===cat && (filter==='all' || (filter==='todo' && !i.checked) || (filter==='done' && i.checked)));
    if (items.length) acc[cat] = items;
    return acc;
  }, {});
  const uncheckedCount = shoppingItems.filter(i=>!i.checked).length;
  const checkedCount = shoppingItems.filter(i=>i.checked).length;

  return (
    <div className="fade-in space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-xl font-bold text-slate-800">🛒 Liste de courses</h2>
        {checkedCount > 0 && (
          <button onClick={clearChecked} className="text-xs text-rose-500 hover:underline">Supprimer achetés ({checkedCount})</button>
        )}
      </div>

      {/* Add form */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div className="flex gap-2 mb-2">
          <input className="flex-1 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
            placeholder="Ajouter un article..."
            value={form.name} onChange={e => setForm(p=>({...p,name:e.target.value}))}
            onKeyDown={e => e.key==='Enter' && addItem()} />
          <input className="w-24 border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
            placeholder="Qté"
            value={form.quantity} onChange={e => setForm(p=>({...p,quantity:e.target.value}))}
            onKeyDown={e => e.key==='Enter' && addItem()} />
          <button onClick={addItem} className="bg-indigo-600 text-white px-4 rounded-lg text-sm font-medium hover:bg-indigo-700">+</button>
        </div>
        <select className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 text-slate-600"
          value={form.category} onChange={e => setForm(p=>({...p,category:e.target.value}))}>
          {CATEGORIES.map(c => <option key={c}>{c}</option>)}
        </select>
      </div>

      {/* Filters */}
      <div className="flex gap-2">
        {[['all','Tous'],['todo','À acheter'],['done','Achetés']].map(([v,l]) => (
          <button key={v} onClick={() => setFilter(v)}
            className={`px-3 py-1.5 rounded-full text-sm font-medium transition-all ${filter===v?'bg-indigo-600 text-white':'bg-white text-slate-600 border border-slate-200 hover:border-indigo-300'}`}>
            {l}{v==='todo'&&uncheckedCount>0?` (${uncheckedCount})`:''}
          </button>
        ))}
      </div>

      {/* Items by category */}
      <div className="space-y-3">
        {Object.entries(grouped).map(([cat,items]) => (
          <div key={cat} className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div className="px-4 py-2 bg-slate-50 border-b border-slate-100">
              <span className="text-xs font-semibold text-slate-500 uppercase tracking-wide">{cat}</span>
            </div>
            <div className="divide-y divide-slate-50">
              {items.map(item => (
                <div key={item.id} className={`checklist-item flex items-center gap-3 px-4 py-3 hover:bg-slate-50 ${item.checked?'checked':''}`}>
                  <input type="checkbox" checked={item.checked} onChange={() => toggle(item.id)}
                    className="w-4 h-4 accent-indigo-600 cursor-pointer" />
                  <label className="flex-1 text-sm text-slate-700 cursor-pointer" onClick={() => toggle(item.id)}>
                    {item.name}
                    {item.quantity && <span className="text-slate-400 ml-1">· {item.quantity}</span>}
                    {item.fromMeal && <span className="ml-2 text-xs text-indigo-400 bg-indigo-50 px-1.5 py-0.5 rounded">menu</span>}
                  </label>
                  <button onClick={() => remove(item.id)} className="text-slate-300 hover:text-rose-400 text-xs px-1">✕</button>
                </div>
              ))}
            </div>
          </div>
        ))}
        {Object.keys(grouped).length === 0 && (
          <div className="text-center py-12 text-slate-400">
            <div className="text-4xl mb-2">🛒</div>
            <p className="text-sm">Liste vide — ajoutez des articles ou planifiez des repas !</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Planning crèche ───────────────────────────────────────────────────────────
// Semaine de référence : vendredi 3 avril 2026 = Mamie Guida
const MAMIE_REF_MONDAY = new Date('2026-03-30');
function getMamieForWeek(weekStart) {
  const weeks = Math.round((weekStart - MAMIE_REF_MONDAY) / (7 * 86400000));
  return weeks % 2 === 0 ? 'Mamie Guida' : 'Mamie Lala';
}

function CrecheSchedule({ crecheSchedule, setCrecheSchedule, settings, trips }) {
  const [weekStart, setWeekStart] = useState(getMonday(new Date()));
  const allDays = Array.from({length:5}, (_,i) => addDays(weekStart, i));
  const days = allDays.filter((_,i) => [1,2,3].includes(i)); // Mar, Mer, Jeu
  const friday = addDays(weekStart, 4);
  const mamie = getMamieForWeek(weekStart);

  const persons = [settings.myName || 'Damien', settings.partnerName || 'Ma femme'];

  function getTripForDay(d) {
    const dStr = fmtDate(d);
    return (trips || []).find(t => {
      const startStr = t.startDate;
      const endStr = t.endDate || t.startDate;
      return dStr >= startStr && dStr <= endStr;
    });
  }

  function toggle(dateKey, type) {
    setCrecheSchedule(p => {
      const cur = p[dateKey]?.[type];
      const next = cur === persons[0] ? persons[1] : cur === persons[1] ? null : persons[0];
      return {...p, [dateKey]: {...(p[dateKey]||{}), [type]: next}};
    });
  }

  function PersonBtn({ dateKey, type }) {
    const val = crecheSchedule[dateKey]?.[type];
    const isDamien = val === persons[0];
    return (
      <button
        onClick={() => toggle(dateKey, type)}
        className={`w-full py-2 px-2 rounded-xl text-xs font-semibold transition-all border-2 ${
          val === persons[0] ? 'person-damien border-blue-300' :
          val === persons[1] ? 'person-wife border-pink-300' :
          'bg-slate-100 text-slate-400 border-transparent hover:border-slate-200'
        }`}
      >
        {val || '—'}
      </button>
    );
  }

  function copyWeek() {
    const thisWeek = {};
    days.forEach(d => {
      const dk = fmtDate(d);
      const nextDk = fmtDate(addDays(d, 7));
      if (crecheSchedule[dk]) thisWeek[nextDk] = crecheSchedule[dk];
    });
    setCrecheSchedule(p => ({...p, ...thisWeek}));
    setWeekStart(p => addDays(p, 7));
  }

  const fmtWeek = `${weekStart.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – ${addDays(weekStart,4).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`;

        <div className="flex items-center gap-2">
          <button onClick={() => setWeekStart(p => addDays(p,-7))} className="p-2 rounded-lg hover:bg-slate-200 text-slate-600">◀</button>
          <span className="text-sm font-medium text-slate-600">{fmtWeek}</span>
          <button onClick={() => setWeekStart(p => addDays(p,7))} className="p-2 rounded-lg hover:bg-slate-200 text-slate-600">▶</button>
        </div>

          <div className="flex items-center gap-2"><span className="w-3 h-3 rounded-full bg-orange-300 inline-block"></span><span className="text-slate-600">Mamie Lala</span></div>
          <div className="text-slate-400 ml-auto text-xs self-center">Cliquez pour changer</div>
        </div>
      </div>

      <div className="grid gap-3">
        {days.map((d) => {
          const dk = fmtDate(d);

          return (

                    <span className="text-lg">{trip.emoji || '✈️'}</span>
                    <div>
                      <div className="text-xs font-semibold text-purple-700">En voyage</div>

        {/* Vendredi — alternance Mamie */}
        {(() => {

          const isToday = fridayKey === fmtDate(new Date());
          const trip = getTripForDay(friday);
          const MAMIES = ['Mamie Guida', 'Mamie Lala'];
          // Override possible, sinon roulement automatique
          const mamieDisplay = crecheSchedule[fridayKey]?.mamie || mamie;
          const mamieOther = MAMIES.find(m => m !== mamieDisplay);
          const isGuida = mamieDisplay === 'Mamie Guida';
          const nextWeekMamie = getMamieForWeek(addDays(weekStart, 7));

          function toggleMamie() {
            setCrecheSchedule(p => ({...p, [fridayKey]: {...(p[fridayKey]||{}), mamie: mamieOther}}));

            <div className={`bg-white rounded-2xl p-4 shadow-sm border ${isToday?'border-indigo-300 ring-1 ring-indigo-200': trip ? 'border-purple-200' : 'border-slate-100'}`}>
              <div className="flex items-center gap-3">
                <div className="w-16 flex-shrink-0">
                  <div className={`text-sm font-semibold ${isToday?'text-indigo-600':'text-slate-700'}`}>Vendredi</div>
                  <div className="text-xs text-slate-400">{friday.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}</div>
                </div>
                {trip ? (

const EMOJIS = ['🗺️','✈️','🏖️','🏔️','🏕️','🌍','🗼','🏯','🗽','🎡','🚂','🛳️'];

// Redimensionne une image côté client via Canvas (retourne une dataURL)
function resizeTripCover(file, maxW=900, maxH=400) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = e => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
        const w = Math.round(img.width * ratio);
        const h = Math.round(img.height * ratio);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
// ── Carte du monde Leaflet (liée aux voyages) ─────────────────────────────────
function WorldMap({ trips }) {
  const containerRef = useRef(null);
  const mapRef       = useRef(null);
  const markersRef   = useRef([]);
  const initDoneRef  = useRef(false);

  function updateMarkers(currentTrips) {
    if (!mapRef.current) return;
    markersRef.current.forEach(m => m.remove());
    markersRef.current = [];
    const today = new Date();
    const withCoords = currentTrips.filter(t => t.lat != null && t.lng != null);
    if (!withCoords.length) return;
    const bounds = [];
    withCoords.forEach(t => {
      const start = new Date(t.startDate);
      const end   = t.endDate ? new Date(t.endDate) : start;
      const isPast    = end < today;
      const isOngoing = start <= today && end >= today;
      const color = isOngoing ? '#22c55e' : isPast ? '#94a3b8' : '#6366f1';
      const ring  = isOngoing ? '#bbf7d0' : isPast ? '#e2e8f0' : '#c7d2fe';
      const icon = L.divIcon({
        html: `<div style="background:${color};width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;border:3px solid white;box-shadow:0 2px 10px rgba(0,0,0,.3);outline:3px solid ${ring}">${t.emoji||'📍'}</div>`,
        className:'', iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-18],
      });
      const nights = t.endDate ? Math.round((end-start)/86400000) : 0;
      const dateStr = start.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'});
      const popup = `<div style="font-family:Inter,sans-serif;min-width:150px;line-height:1.5">
        <div style="font-weight:700;font-size:13px">${t.emoji} ${t.name}</div>
        <div style="color:#64748b;font-size:12px">${t.destination}</div>
        <div style="color:#94a3b8;font-size:11px;margin-top:3px">📅 ${dateStr}${nights>0?` · 🌙 ${nights} nuits`:''}</div>
        ${isOngoing?'<div style="color:#16a34a;font-size:11px;font-weight:600">🟢 En cours</div>':''}
      </div>`;
      const marker = L.marker([t.lat, t.lng], {icon})
        .bindPopup(popup, {maxWidth:240})
        .addTo(mapRef.current);
      markersRef.current.push(marker);
      bounds.push([t.lat, t.lng]);
    });
    if (bounds.length === 1) mapRef.current.setView(bounds[0], 5);
    else mapRef.current.fitBounds(bounds, {padding:[40,40], maxZoom:6});
  }

  function initMap(currentTrips) {
    if (initDoneRef.current || !containerRef.current) return;
    initDoneRef.current = true;
    mapRef.current = L.map(containerRef.current, {zoomControl:true, scrollWheelZoom:false, attributionControl:false})
      .setView([20, 10], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains:'abcd', maxZoom:19,
      attribution:'© <a href="https://carto.com">CARTO</a> © <a href="https://openstreetmap.org">OSM</a>',
    }).addTo(mapRef.current);
    updateMarkers(currentTrips);
  }

  useEffect(() => {
    const t = setTimeout(() => initMap(trips), 60);
    return () => {
      clearTimeout(t);
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; initDoneRef.current = false; }
    };
  }, []);

  useEffect(() => { updateMarkers(trips); }, [trips]);

  const withCoords = trips.filter(t => t.lat != null);

  return (
    <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div className="px-4 pt-4 pb-2 flex items-center justify-between">
        <div>
          <h3 className="font-semibold text-slate-700">🌍 Notre carte du monde</h3>
          <p className="text-xs text-slate-400 mt-0.5">{withCoords.length} destination{withCoords.length!==1?'s':''} · cliquez sur un marqueur</p>
        </div>
        <div className="flex items-center gap-2 text-[10px] text-slate-400">
          <span><span style={{color:'#6366f1'}}>●</span> À venir</span>
          <span><span style={{color:'#22c55e'}}>●</span> En cours</span>
          <span><span style={{color:'#94a3b8'}}>●</span> Passés</span>
        </div>
      </div>
      <div style={{position:'relative'}}>
        <div ref={containerRef} style={{height:'300px', width:'100%'}} />
        {withCoords.length === 0 && (
          <div style={{position:'absolute',inset:0,zIndex:500,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'rgba(248,250,252,0.92)',gap:'8px'}}>
            <span style={{fontSize:'40px'}}>🗺️</span>
            <p style={{color:'#94a3b8',fontSize:'14px'}}>Aucune destination géolocalisée</p>
            <p style={{color:'#cbd5e1',fontSize:'12px'}}>Renseignez la destination lors de l'ajout d'un voyage</p>
          </div>
        )}
      </div>
    </div>
  );
}

// Géocode une destination via Nominatim (OpenStreetMap, gratuit)
async function geocodeDestination(destination) {
  if (!destination) return null;
  try {
    const res  = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(destination)}&format=json&limit=1`);
    const json = await res.json();
    if (json[0]) return { lat: parseFloat(json[0].lat), lng: parseFloat(json[0].lon) };
  } catch {}
  return null;
}

function TripPlanner({ trips, setTrips }) {
  const [modal, setModal] = useState(false);
  const [editTrip, setEditTrip] = useState(null);
  const [form, setForm] = useState({name:'',destination:'',startDate:'',endDate:'',emoji:'✈️',notes:'',budget:''});
  const [geocoding, setGeocoding] = useState(false);
  const coverInputRef = useRef(null);

  function openAdd() { setForm({name:'',destination:'',startDate:'',endDate:'',emoji:'✈️',notes:'',budget:'',cover:''}); setEditTrip(null); setModal(true); }
  function openEdit(t) { setForm({...t, cover: t.cover||''}); setEditTrip(t.id); setModal(true); }

  async function handleCoverChange(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const dataUrl = await resizeTripCover(file);
      setForm(p => ({...p, cover: dataUrl}));
    } catch { /* ignore */ }
  }
  async function save() {
    if (!form.name || !form.startDate) return;
    let { lat, lng } = form;
    const original = editTrip ? trips.find(t => t.id === editTrip) : null;
    const destChanged = !original || original.destination !== form.destination;
    if (form.destination && (destChanged || lat == null)) {
      setGeocoding(true);
      const coords = await geocodeDestination(form.destination);
      if (coords) { lat = coords.lat; lng = coords.lng; }
      setGeocoding(false);
    }
    const tripData = { ...form, lat, lng };
    if (editTrip) {
      setTrips(p => p.map(t => t.id===editTrip ? {...tripData, id:editTrip} : t));
    } else {
      setTrips(p => [...p, {...tripData, id:uid()}]);
    }
    setModal(false);
  }
  function remove(id) { if (confirm('Supprimer ce voyage ?')) setTrips(p => p.filter(t => t.id!==id)); }

  const today = new Date();
  const past = trips.filter(t => new Date(t.endDate||t.startDate) < today).sort((a,b) => new Date(b.startDate)-new Date(a.startDate));
  const upcoming = trips.filter(t => new Date(t.startDate) >= today).sort((a,b) => new Date(a.startDate)-new Date(b.startDate));
  const ongoing = trips.filter(t => new Date(t.startDate) <= today && new Date(t.endDate||t.startDate) >= today);

  function TripCard({ t }) {
    const start = new Date(t.startDate);
    const end = t.endDate ? new Date(t.endDate) : null;
    const nights = end ? Math.round((end-start)/86400000) : 0;
    const daysLeft = Math.ceil((start-today)/86400000);
    const isOngoing = start <= today && (!end || end >= today);

    const headerStyle = t.cover
      ? { backgroundImage:`url(${t.cover})`, backgroundSize:'cover', backgroundPosition:'center' }
      : {};

    return (
      <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-md transition-shadow">
        <div className={t.cover ? '' : 'trip-card'} style={headerStyle}>
          {/* Overlay sombre si photo */}
          <div style={t.cover ? {background:'linear-gradient(135deg,rgba(30,15,60,.62) 0%,rgba(80,40,120,.52) 100%)',padding:'16px'} : {padding:'16px'}}>
            <div className="flex items-start justify-between text-white">
              <div>
                <div className="text-3xl mb-1">{t.emoji}</div>
                <h3 className="font-bold text-lg leading-tight drop-shadow">{t.name}</h3>
                <p className="text-purple-200 text-sm drop-shadow">{t.destination}</p>
              </div>
              <div className="text-right">
                {isOngoing
                  ? <Pill color="green">En cours</Pill>
                  : daysLeft > 0
                    ? <div className="bg-white/20 rounded-xl px-3 py-1 text-center backdrop-blur-sm"><div className="text-2xl font-bold">{daysLeft}</div><div className="text-xs text-purple-200">jours</div></div>
                    : <Pill color="purple">Passé</Pill>
                }
              </div>
            </div>
          </div>
        </div>
        <div className="px-4 py-3">
          <div className="flex gap-4 text-xs text-slate-500 mb-2">
            <span>📅 {start.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</span>
            {end && <span>→ {end.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}</span>}
            {nights > 0 && <span>🌙 {nights} nuits</span>}

function usePhotoDB() {
  const [photos, setPhotos] = useLocalStorage('photos', []);

  async function resizeImage(file, maxPx = 1200, quality = 0.75) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = e => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
          const canvas = document.createElement('canvas');
          canvas.width  = Math.round(img.width  * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function addPhotos(files) {
    const added = [];
    for (const file of Array.from(files)) {
      try {
        const url = await resizeImage(file);
        added.push({ id: uid(), url, name: file.name, added: Date.now() });
      } catch(err) { console.warn('Photo ignorée :', file.name, err); }
    }
    if (added.length) setPhotos(p => [...p, ...added]);
  }

  function removePhoto(id) {
    setPhotos(p => p.filter(ph => ph.id !== id));
  }

  return { photos, addPhotos, removePhoto };
}

// ── Domotique — Tuya API helpers ──────────────────────────────────────────────
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hmacSHA256Upper(secret, data) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(data));
  return Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2,'0')).join('').toUpperCase();
}
let _tuyaCache = { token: null, expiry: 0 };
async function tuyaGetToken(accessId, secret, region) {
  if (_tuyaCache.token && Date.now() < _tuyaCache.expiry) return _tuyaCache.token;
  const t = String(Date.now()), nonce = uid();
  const sts = ['GET', await sha256Hex(''), '', '/v1.0/token?grant_type=1'].join('\n');
  const sign = await hmacSHA256Upper(secret, accessId + t + nonce + sts);
  const res = await fetch(`https://openapi.tuya${region}.com/v1.0/token?grant_type=1`, {
    headers: { 'client_id': accessId, 'sign': sign, 't': t, 'nonce': nonce, 'sign_method': 'HMAC-SHA256' }
  });
  const json = await res.json();
  if (!json.success) throw new Error(`Tuya auth échouée : ${json.msg}`);
  _tuyaCache = { token: json.result.access_token, expiry: Date.now() + (json.result.expire_time - 60) * 1000 };
  return _tuyaCache.token;
}
async function tuyaReq(cfg, method, path, body = null) {
  const { accessId, secret, region } = cfg;
  const token = await tuyaGetToken(accessId, secret, region || 'eu');
  const t = String(Date.now()), nonce = uid();
  const bodyStr = body ? JSON.stringify(body) : '';
  const sts = [method, await sha256Hex(bodyStr), '', path].join('\n');
  const sign = await hmacSHA256Upper(secret, accessId + token + t + nonce + sts);
  const res = await fetch(`https://openapi.tuya${region || 'eu'}.com${path}`, {
    method,
    headers: { 'client_id': accessId, 'access_token': token, 'sign': sign, 't': t, 'nonce': nonce, 'sign_method': 'HMAC-SHA256', 'Content-Type': 'application/json' },
    body: body ? bodyStr : undefined
  });
  return res.json();
}

const ANNIV_EMOJIS = ['🎂','🎁','🌹','⭐','🎉','👶','💍','🏆','🐣','🦁'];

function nextOccurrence(day, month) {
  const now = new Date();
  const thisYear = new Date(now.getFullYear(), month - 1, day);
  if (thisYear > now) return thisYear;
  return new Date(now.getFullYear() + 1, month - 1, day);
}
function daysUntil(day, month) {
  const next = nextOccurrence(day, month);
  return Math.ceil((next - new Date()) / 86400000);
}

function Anniversaires({ anniversaires, setAnniversaires }) {
  const [modal, setModal] = useState(false);
  const [edit, setEdit] = useState(null);
  const [form, setForm] = useState({ name:'', day:'', month:'', year:'', emoji:'🎂' });

  function openEdit(a) { setForm(a); setEdit(a.id); setModal(true); }
  function save() {
    if (!form.name || !form.day || !form.month) return;
    if (edit) setAnniversaires(p => p.map(a => a.id === edit ? {...form, id: edit} : a));
    else setAnniversaires(p => [...p, {...form, id: uid()}]);
    setModal(false);
  }
  function remove(id) { setAnniversaires(p => p.filter(a => a.id !== id)); }

  const sorted = [...anniversaires].sort((a, b) => daysUntil(a.day, a.month) - daysUntil(b.day, b.month));

  return (
    <div className="fade-in space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-xl font-bold text-slate-800">🎂 Anniversaires</h2>
        <button onClick={openAdd} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700">+ Ajouter</button>
      </div>

      {sorted.length === 0 ? (
        <div className="text-center py-16 text-slate-400">
          <div className="text-5xl mb-3">🎂</div>
          <p className="font-medium text-slate-600 mb-1">Aucun anniversaire</p>
          <p className="text-sm mb-5">Ajoutez vos proches pour ne plus jamais oublier</p>
          <button onClick={openAdd} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-indigo-700">Ajouter</button>
        </div>
      ) : (
        <div className="space-y-3">
          {sorted.map(a => {
            const days = daysUntil(a.day, a.month);
            const isToday = days === 0;
            const isSoon = days <= 7;
            const age = a.year ? new Date().getFullYear() - a.year + (days === 0 ? 0 : 0) : null;
            return (
              <div key={a.id} className={`bg-white rounded-2xl p-4 shadow-sm border flex items-center gap-4 ${isToday ? 'border-indigo-300 ring-1 ring-indigo-200' : 'border-slate-100'}`}>
                <div className={`w-12 h-12 rounded-2xl flex items-center justify-center text-2xl flex-shrink-0 ${isToday ? 'bg-indigo-100' : 'bg-slate-50'}`}>{a.emoji}</div>
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-slate-800 truncate">{a.name}</div>
                  <div className="text-xs text-slate-500">
                    {String(a.day).padStart(2,'0')}/{String(a.month).padStart(2,'0')}{a.year ? `/${a.year}` : ''}
                    {age !== null && <span className="ml-1">· {age} ans</span>}
                  </div>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  {isToday
                    ? <span className="bg-indigo-600 text-white text-xs font-bold px-3 py-1 rounded-full">Aujourd'hui 🎉</span>
                    : <div className={`text-center rounded-xl px-3 py-1 ${isSoon ? 'bg-rose-50 text-rose-600' : 'bg-slate-50 text-slate-500'}`}>
                        <div className="text-lg font-bold leading-none">{days}</div>
                        <div className="text-xs">jours</div>
                      </div>
                  }
                  <button onClick={() => openEdit(a)} className="text-slate-300 hover:text-indigo-500 text-sm">✏️</button>
                  <button onClick={() => remove(a.id)} className="text-slate-300 hover:text-rose-400 text-sm">✕</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <Modal open={modal} onClose={() => setModal(false)} title={edit ? 'Modifier' : '🎂 Nouvel anniversaire'}>
        <div className="space-y-3">
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Prénom / Nom *</label>
            <input autoFocus className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300"
              placeholder="Ex: Mamie Lala" value={form.name} onChange={e => setForm(p=>({...p,name:e.target.value}))} />

                <button key={e} onClick={() => setForm(p=>({...p,emoji:e}))}

const NOTE_COLORS = {
  yellow: { bg:'bg-amber-50',  border:'border-amber-200',  dot:'bg-amber-400',  dark:'rgba(245,158,11,.15)' },
  blue:   { bg:'bg-blue-50',   border:'border-blue-200',   dot:'bg-blue-400',   dark:'rgba(59,130,246,.15)' },
  green:  { bg:'bg-green-50',  border:'border-green-200',  dot:'bg-green-400',  dark:'rgba(34,197,94,.15)'  },
  pink:   { bg:'bg-pink-50',   border:'border-pink-200',   dot:'bg-pink-400',   dark:'rgba(236,72,153,.15)' },
  purple: { bg:'bg-purple-50', border:'border-purple-200', dot:'bg-purple-400', dark:'rgba(168,85,247,.15)' },
};

function PenseBete({ notes, setNotes }) {
  const [modal, setModal] = useState(false);
  const [edit, setEdit] = useState(null);
  const [form, setForm] = useState({ title:'', content:'', color:'yellow', pinned:false });

  function openAdd() { setForm({ title:'', content:'', color:'yellow', pinned:false }); setEdit(null); setModal(true); }
  function openEdit(n) { setForm(n); setEdit(n.id); setModal(true); }
  function save() {
    if (!form.content.trim()) return;
    if (edit) setNotes(p => p.map(n => n.id === edit ? {...form, id:edit} : n));
    else setNotes(p => [...p, {...form, id:uid(), created:Date.now()}]);
    setModal(false);
  }
  function remove(id) { setNotes(p => p.filter(n => n.id !== id)); }
  function togglePin(id) { setNotes(p => p.map(n => n.id===id ? {...n, pinned:!n.pinned} : n)); }

  const pinned = notes.filter(n => n.pinned).sort((a,b) => b.created - a.created);
  const rest = notes.filter(n => !n.pinned).sort((a,b) => b.created - a.created);
  const sorted = [...pinned, ...rest];

  return (
    <div className="fade-in space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="text-xl font-bold text-slate-800">📝 Pense-bête</h2>
        <button onClick={openAdd} className="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700">+ Ajouter</button>
      </div>

      {sorted.length === 0 ? (
        <div className="text-center py-16 text-slate-400">
          <div className="text-5xl mb-3">📝</div>
          <p className="font-medium text-slate-600 mb-1">Aucune note</p>
          <p className="text-sm mb-5">Notez vos rappels, idées, choses à faire...</p>
          <button onClick={openAdd} className="bg-indigo-600 text-white px-6 py-2.5 rounded-xl text-sm font-medium hover:bg-indigo-700">Créer une note</button>
        </div>
      ) : (
        <div className="grid grid-cols-2 gap-3">
          {sorted.map(n => {
            const c = NOTE_COLORS[n.color] || NOTE_COLORS.yellow;
            return (
              <div key={n.id} className={`${c.bg} ${c.border} border rounded-2xl p-3 flex flex-col gap-2 relative`}>
                {n.pinned && <span className="absolute top-2 right-2 text-xs">📌</span>}
                {n.title && <div className="font-semibold text-slate-700 text-sm pr-5 leading-tight">{n.title}</div>}
                <div className="text-sm text-slate-600 leading-snug flex-1 whitespace-pre-wrap">{n.content}</div>

const VACUUM_LABELS = { standby:'En veille', cleaning:'Nettoyage…', returning:'Retour base', charging:'En charge', paused:'En pause', sleep:'Endormi', goto:'Se déplace' };
const PLUG_ICONS_LIST = ['💡','🔌','📺','🖥️','🎮','🎵','❄️','🍳','☕','🛋️','🪴','🏮'];

function useDomotique(cfg) {
  const [states, setStates] = useState({});
  const [loading, setLoading] = useState({});
  const [apiError, setApiError] = useState(null);
  const hasTuya = !!(cfg?.tuya?.accessId && cfg?.tuya?.secret);

  async function refresh() {
    if (!hasTuya) return;
    setApiError(null);
    try {
      if (cfg.vacuum?.enabled && cfg.vacuum?.deviceId) {
        const r = await tuyaReq(cfg.tuya, 'GET', `/v1.0/devices/${cfg.vacuum.deviceId}/status`);
        if (r.success) {
          const st = {}; r.result.forEach(i => { st[i.code] = i.value; });
          setStates(p => ({...p, vacuum: st}));
        }
      }
      for (const plug of (cfg.plugs || [])) {
        if (plug.deviceId) {
          const r = await tuyaReq(cfg.tuya, 'GET', `/v1.0/devices/${plug.deviceId}/status`);
          if (r.success) {
            const on = r.result.find(i => ['switch_1','switch'].includes(i.code))?.value ?? false;
            setStates(p => ({...p, [plug.id]: {on}}));
          }
        }
      }
    } catch(e) { setApiError(e.message); }
  }

  async function vacuumCmd(cmd) {
    if (!hasTuya || !cfg.vacuum?.deviceId) return;
    setLoading(p => ({...p, vacuum:true})); setApiError(null);
    const map = { start:[{code:'switch_go',value:true}], stop:[{code:'switch_go',value:false}], home:[{code:'switch_return',value:true}] };
    try { await tuyaReq(cfg.tuya, 'POST', `/v1.0/devices/${cfg.vacuum.deviceId}/commands`, {commands:map[cmd]}); setTimeout(refresh, 2000); }
    catch(e) { setApiError(e.message); }
    setLoading(p => ({...p, vacuum:false}));
  }

  async function togglePlug(plug) {
    const isOn = states[plug.id]?.on ?? false;
    setLoading(p => ({...p, [plug.id]:true})); setApiError(null);
    if (hasTuya && plug.deviceId) {
      try { await tuyaReq(cfg.tuya, 'POST', `/v1.0/devices/${plug.deviceId}/commands`, {commands:[{code:'switch_1',value:!isOn}]}); }
      catch(e) { setApiError(e.message); }
    }
    setStates(p => ({...p, [plug.id]:{on:!isOn}}));
    setLoading(p => ({...p, [plug.id]:false}));
  }

  useEffect(() => { refresh(); }, [JSON.stringify(cfg?.tuya), cfg?.vacuum?.deviceId, (cfg?.plugs||[]).map(p=>p.deviceId).join()]);
  return { states, loading, apiError, refresh, vacuumCmd, togglePlug, hasTuya };
}

function FearGreedGauge({ value, classification }) {
  // Arc SVG : demi-cercle de -180° à 0°
  const cx = 110, cy = 110, r = 85;
  const toRad = deg => (deg * Math.PI) / 180;
  const pct = Math.min(Math.max(value / 100, 0), 1);
  // needle angle : -180° (0) → 0° (100)
  const needleAngle = -180 + pct * 180;
  const needleRad = toRad(needleAngle);
  const nx = cx + (r - 20) * Math.cos(needleRad);
  const ny = cy + (r - 20) * Math.sin(needleRad);

  // gradient zones (5 segments)
  const segments = [
    { from:-180, to:-144, color:'#ef4444' },
    { from:-144, to:-108, color:'#f97316' },
    { from:-108, to: -72, color:'#eab308' },
    { from: -72, to: -36, color:'#22c55e' },
    { from: -36, to:   0, color:'#16a34a' },
  ];
  function arcPath(fromDeg, toDeg, radius) {
    const f = toRad(fromDeg), t = toRad(toDeg);
    const x1 = cx + radius * Math.cos(f), y1 = cy + radius * Math.sin(f);
    const x2 = cx + radius * Math.cos(t), y2 = cy + radius * Math.sin(t);
    return `M ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2}`;
  }

  const info = FNG_LABELS[classification] || FNG_LABELS['Neutral'];
  return (
    <div className="flex flex-col items-center">
      <svg width="220" height="120" viewBox="0 0 220 120">
        {/* Track */}
        {segments.map((s,i) => (
          <path key={i} d={arcPath(s.from, s.to, r)} fill="none" stroke={s.color} strokeWidth="18" strokeLinecap="butt" opacity="0.25"/>
        ))}
        {/* Active arc */}
        {segments.map((s,i) => {
          const startAngle = -180;
          const endAngle = -180 + pct * 180;
          // clip each segment
          const segFrom = Math.max(s.from, startAngle);
          const segTo   = Math.min(s.to,   endAngle);
          if (segTo <= segFrom) return null;

function MortgageSection() {
  const MONTHS_FR = ['Jan','Fév','Mar','Avr','Mai','Jun','Jul','Aoû','Sep','Oct','Nov','Déc'];
  const [showTable, setShowTable] = useState(false);

  const now = new Date();
  const cyear = now.getFullYear();
  const cmonth = now.getMonth() + 1;

  const currentIdx = MORTGAGE_DATA.findIndex(r => r.year === cyear && r.month === cmonth);
  const idx = currentIdx >= 0 ? currentIdx : 0;
  const current = MORTGAGE_DATA[idx];
  const totalN = MORTGAGE_DATA[MORTGAGE_DATA.length - 1].n; // 213 échéances au total
  const progressPct = Math.round((current.n / totalN) * 100);

  const remaining = MORTGAGE_DATA.slice(idx);
  const totalInterets = remaining.reduce((s, r) => s + r.interets, 0);
  const totalAssur   = remaining.reduce((s, r) => s + r.assur,    0);
  const nextRows = MORTGAGE_DATA.slice(idx + 1, idx + 13);

  // SVG chart constants
  const W = 440, H = 110, PL = 44, PR = 8, PT = 10, PB = 22;
  const cW = W - PL - PR, cH = H - PT - PB;
  const dataLen = MORTGAGE_DATA.length;
  const maxCap = MORTGAGE_DATA[0].capAmorti + MORTGAGE_DATA[0].capRestant; // ~179 980
  const toX = i => PL + (i / (dataLen - 1)) * cW;
  const toY = v => PT + cH - (v / maxCap) * cH;

  // Build line path (every 3rd point + last)
  let linePath = '';
  MORTGAGE_DATA.forEach((r, i) => {
    if (i % 3 !== 0 && i !== dataLen - 1) return;
    const x = toX(i).toFixed(1), y = toY(r.capRestant).toFixed(1);
    linePath += linePath === '' ? `M${x},${y}` : ` L${x},${y}`;
  });
  const areaPath = linePath + ` L${toX(dataLen-1).toFixed(1)},${(PT+cH).toFixed(1)} L${PL},${(PT+cH).toFixed(1)} Z`;
  const curX = toX(idx), curY = toY(current.capRestant);
  const yLabels = [0, 50000, 100000, 150000];

  const fmtE = v => v != null ? v.toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €' : '–';

  return (
    <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
      <h3 className="font-semibold text-slate-700">🏠 Prêt Immobilier</h3>

      {/* Hero card */}
      <div className="bg-gradient-to-br from-indigo-50 to-blue-50 rounded-xl p-4 space-y-3">
        <div className="flex justify-between items-start">
          <div>
            <p className="text-xs text-slate-500 mb-1">Capital restant dû</p>
            <p className="text-3xl font-bold text-indigo-700">{fmtE(current.capRestant)}</p>
          </div>
          <div className="text-right">
            <p className="text-xs text-slate-500 mb-1">Mensualité</p>
            <p className="text-xl font-bold text-slate-700">{fmtE(current.echeance)}</p>
            <p className="text-xs text-slate-400 mt-0.5">Échéance n°{current.n}</p>
          </div>
        </div>
        <div>
          <div className="flex justify-between text-xs text-slate-500 mb-1.5">
            <span>{progressPct}% du prêt remboursé</span>
            <span>Fin : fév. 2038</span>
          </div>
          <div className="w-full bg-white/70 rounded-full h-2.5">
            <div className="bg-indigo-500 h-2.5 rounded-full transition-all" style={{width:`${progressPct}%`}} />
          </div>
        </div>
      </div>

      {/* Ce mois-ci */}
      <div className="grid grid-cols-3 gap-2">
        <div className="bg-rose-50 rounded-xl p-3 text-center border border-rose-100">
          <p className="text-[11px] text-rose-400 font-medium mb-1">💸 Intérêts</p>
          <p className="text-sm font-bold text-rose-600">{current.interets.toFixed(2)} €</p>
        </div>
        <div className="bg-amber-50 rounded-xl p-3 text-center border border-amber-100">
          <p className="text-[11px] text-amber-500 font-medium mb-1">🛡️ Assurance</p>
          <p className="text-sm font-bold text-amber-600">{current.assur.toFixed(2)} €</p>
        </div>
        <div className="bg-emerald-50 rounded-xl p-3 text-center border border-emerald-100">
          <p className="text-[11px] text-emerald-500 font-medium mb-1">🏗️ Capital</p>
          <p className="text-sm font-bold text-emerald-600">{current.capAmorti.toFixed(2)} €</p>
        </div>
      </div>

      {/* SVG chart */}
      <div>
        <p className="text-xs font-medium text-slate-500 mb-2">Évolution du capital restant dû</p>
        <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{height:'120px'}}>
          {yLabels.map(v => (
            <g key={v}>
              <line x1={PL} y1={toY(v)} x2={W-PR} y2={toY(v)} stroke="#e2e8f0" strokeWidth="0.5"/>
              <text x={PL-4} y={toY(v)+3} textAnchor="end" fontSize="7" fill="#94a3b8">
                {v === 0 ? '0' : `${v/1000}k`}
              </text>
            </g>
          ))}
          <path d={areaPath} fill="#eef2ff" opacity="0.65"/>
          <path d={linePath} fill="none" stroke="#6366f1" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          <line x1={curX} y1={PT} x2={curX} y2={PT+cH} stroke="#6366f1" strokeWidth="1" strokeDasharray="3,2" opacity="0.55"/>
          <circle cx={curX} cy={curY} r="3.5" fill="#6366f1"/>
          <text x={curX > W/2 ? curX-5 : curX+5} y={curY-5}
            textAnchor={curX > W/2 ? 'end' : 'start'} fontSize="7" fill="#4f46e5" fontWeight="bold">
            Aujourd'hui
          </text>
          <line x1={PL} y1={PT+cH} x2={W-PR} y2={PT+cH} stroke="#cbd5e1" strokeWidth="0.5"/>
          {MORTGAGE_DATA.filter((_, i) => i % 12 === 0).map((r, li) => (
            <text key={li} x={toX(li * 12)} y={H - 4} textAnchor="middle" fontSize="7" fill="#94a3b8">{r.year}</text>
          ))}
        </svg>
      </div>

      {/* Totaux restants */}
      <div className="grid grid-cols-2 gap-2 text-xs">
        <div className="bg-slate-50 rounded-xl p-3 border border-slate-100">
          <p className="text-slate-400 mb-0.5">Intérêts restants</p>
          <p className="font-semibold text-slate-700">{fmtE(totalInterets)}</p>
        </div>
        <div className="bg-slate-50 rounded-xl p-3 border border-slate-100">
          <p className="text-slate-400 mb-0.5">Assurances restantes</p>
          <p className="font-semibold text-slate-700">{fmtE(totalAssur)}</p>
        </div>
      </div>

      {/* Toggle table */}
      <button onClick={() => setShowTable(v => !v)}
        className="w-full text-xs text-indigo-500 hover:text-indigo-700 flex items-center justify-center gap-1.5 py-1 transition-colors">
        {showTable ? '▲ Masquer le tableau' : '▼ Voir les prochaines échéances'}
      </button>

      {showTable && (
        <div className="overflow-x-auto">
          <table className="w-full text-xs border-collapse">
            <thead>
              <tr className="text-slate-400 border-b border-slate-100">
                <th className="text-left pb-2 font-medium">Date</th>
                <th className="text-right pb-2 font-medium">Mensualité</th>
                <th className="text-right pb-2 font-medium">Intérêts</th>
                <th className="text-right pb-2 font-medium">Assur.</th>
                <th className="text-right pb-2 font-medium">Capital</th>
                <th className="text-right pb-2 font-medium">Restant dû</th>
              </tr>
            </thead>
            <tbody>
              {nextRows.map(r => (
                <tr key={r.n} className="border-t border-slate-50 hover:bg-slate-50">
                  <td className="py-1.5 text-slate-600">{MONTHS_FR[r.month-1]} {r.year}</td>
                  <td className="py-1.5 text-right font-medium text-slate-700">{r.echeance.toFixed(2)} €</td>
                  <td className="py-1.5 text-right text-rose-500">{r.interets.toFixed(2)} €</td>
                  <td className="py-1.5 text-right text-amber-500">{r.assur.toFixed(2)} €</td>
                  <td className="py-1.5 text-right text-emerald-500">{r.capAmorti.toFixed(2)} €</td>
                  <td className="py-1.5 text-right text-slate-500">{r.capRestant.toFixed(2)} €</td>
                </tr>
              ))}
            </tbody>
          </table>
          <p className="text-[10px] text-slate-400 mt-2 text-center">12 prochaines échéances · Source : Tableau amortissement</p>
        </div>
      )}
    </div>
  );
}

function Finance() {
  const [fng, setFng] = useState(null);           // {value, classification, history:[]}
  const [btc, setBtc] = useState(null);            // {eur, usd, change24h}
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [lastUpdate, setLastUpdate] = useState(null);

  async function loadData() {
    setLoading(true);
    setError(null);
    try {
      // Fear & Greed (7 derniers jours)
      const fngRes = await fetch('https://api.alternative.me/fng/?limit=7');
      const fngJson = await fngRes.json();
      const latest = fngJson.data[0];
      const history = fngJson.data.slice(0, 7).reverse(); // du plus ancien au plus récent
      setFng({
        value: parseInt(latest.value),
        classification: latest.value_classification,
        history: history.map(d => ({
          value: parseInt(d.value),
          classification: d.value_classification,
          date: new Date(parseInt(d.timestamp) * 1000),
        })),
      });
      // BTC price via CoinGecko (no key needed)
      const btcRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur,usd&include_24hr_change=true');
      const btcJson = await btcRes.json();
      setBtc({
        eur: btcJson.bitcoin.eur,
        usd: btcJson.bitcoin.usd,
        change24h: btcJson.bitcoin.usd_24h_change,
      });
      setLastUpdate(new Date());
    } catch(e) {
      setError('Impossible de charger les données. Vérifiez votre connexion.');
    } finally {
      setLoading(false);
    }
  }

  useEffect(() => { loadData(); }, []);

  const fmtEur = n => n?.toLocaleString('fr-FR', {style:'currency', currency:'EUR', maximumFractionDigits:0});
  const fmtUsd = n => n?.toLocaleString('en-US',  {style:'currency', currency:'USD', maximumFractionDigits:0});

  return (
    <div className="fade-in space-y-5">
      <div className="flex items-center justify-between">
        <h2 className="text-xl font-bold text-slate-800">💰 Finance</h2>
        <button onClick={loadData} disabled={loading}
          className="flex items-center gap-1.5 text-xs text-indigo-500 hover:underline disabled:opacity-40">
          {loading ? '⏳' : '🔄'} Actualiser
        </button>
      </div>

      {error && (
        <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-sm text-rose-600">{error}</div>
      )}

      {/* Fear & Greed Index */}
      <div className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
        <div className="flex items-center justify-between mb-4">
          <div>
            <h3 className="font-semibold text-slate-700">😱🤑 Fear & Greed Index</h3>
            <p className="text-xs text-slate-400 mt-0.5">Sentiment du marché Bitcoin</p>
          </div>
          {lastUpdate && <span className="text-xs text-slate-400">{lastUpdate.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span>}
        </div>

        {loading && !fng
          ? <div className="h-36 flex items-center justify-center text-slate-400 text-sm">Chargement…</div>
          : fng && (
            <>
              <FearGreedGauge value={fng.value} classification={fng.classification} />

              {/* Historique 7j */}
              <div className="mt-5">
                <p className="text-xs font-medium text-slate-500 mb-3">Historique 7 jours</p>
                <div className="flex items-end gap-1.5 h-16">
                  {fng.history.map((d, i) => {
                    const info = FNG_LABELS[d.classification] || FNG_LABELS['Neutral'];
                    const h = Math.max(8, Math.round((d.value / 100) * 56));
                    const isLast = i === fng.history.length - 1;
                    return (
                      <div key={i} className="flex-1 flex flex-col items-center gap-1" title={`${d.date.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} — ${d.value} (${info.label})`}>
                        <span className="text-xs font-bold" style={{color: info.color}}>{d.value}</span>
                        <div className="w-full rounded-t-lg transition-all" style={{height:`${h}px`, backgroundColor: info.color, opacity: isLast ? 1 : 0.55}} />

                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="mt-4 flex flex-wrap gap-2 justify-center">
                {Object.entries(FNG_LABELS).map(([k,v]) => (
                  <span key={k} className="text-[10px] font-medium px-2 py-0.5 rounded-full" style={{background:v.bg, color:v.color}}>{v.label}</span>
