        <strong>À propos du Fear &amp; Greed Index :</strong> un indice de 0 à 100 qui mesure le sentiment du marché crypto. En dessous de 25 = peur extrême (souvent une opportunité d'achat). Au-dessus de 75 = avidité extrême (attention aux corrections).
      </div>

      {/* Prêt immobilier */}
      <MortgageSection />
    </div>
  );
}

// ── Pokémon Collection ────────────────────────────────────────────────────────
const POKE_SETS = [
  { id:'base1', name:'Set de Base',  short:'SB',  year:'1999', total:102 },
  { id:'base2', name:'Jungle',       short:'JU',  year:'1999', total:64  },
  { id:'base3', name:'Fossile',      short:'FO',  year:'1999', total:62  },
  { id:'base5', name:'Team Rocket',  short:'TR',  year:'2000', total:83  },
  { id:'gym1',  name:'Gym Heroes',   short:'GH',  year:'2000', total:132 },
  { id:'gym2',  name:'Gym Challenge',short:'GC',  year:'2000', total:132 },
  { id:'neo1',  name:'Néo Genesis',  short:'NG',  year:'2000', total:111 },
  { id:'neo2',  name:'Néo Discovery',short:'ND',  year:'2001', total:75  },
  { id:'neo3',  name:'Néo Revelation',short:'NR', year:'2001', total:66  },
  { id:'neo4',  name:'Néo Destiny',  short:'NDe', year:'2002', total:113 },
];

const RARITY_CFG = {
  'Rare Holo':  { label:'Holo Rare',  symbol:'✨', color:'#d97706', bg:'#fef3c7', order:1 },
  'Rare':       { label:'Rare',       symbol:'⭐', color:'#6366f1', bg:'#eef2ff', order:2 },
  'Uncommon':   { label:'Peu commun', symbol:'🔷', color:'#3b82f6', bg:'#eff6ff', order:3 },
  'Common':     { label:'Commun',     symbol:'○',  color:'#64748b', bg:'#f8fafc', order:4 },
};

const TYPE_COLOR = {
  Grass:'#5a9e3a', Fire:'#e84118', Water:'#0097e6', Lightning:'#e1b12c',
  Psychic:'#e84393', Fighting:'#c0392b', Colorless:'#7f8c8d', Darkness:'#2c3e50',
  Metal:'#636e72', Dragon:'#8e44ad', Fairy:'#fd79a8',
};

function PokemonCollection() {
  const [owned,    setOwned]   = useSharedState('pokeOwned', {});   // partagé
  const [cache,    setCache]   = useLocalStorage('pokeCache', {});  // cache API local uniquement
  const [activeSet,setActiveSet] = useState('base1');
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState(null);
  const [filter,   setFilter]   = useState('all');
  const [zoom,     setZoom]     = useState(false); // agrandi / compact

  const setInfo  = POKE_SETS.find(s => s.id === activeSet);
  const cards    = cache[activeSet] || [];

  useEffect(() => {
    if (!cache[activeSet]) fetchCards(activeSet);
  }, [activeSet]);

  async function fetchCards(setId) {
    setLoading(true); setError(null);
    try {
      const res  = await fetch(
        `https://api.pokemontcg.io/v2/cards?q=set.id:${setId}&orderBy=number&pageSize=250`
      );
      if (!res.ok) throw new Error();
      const json = await res.json();
      setCache(prev => ({...prev, [setId]: json.data || []}));
    } catch { setError('Impossible de charger les cartes. Vérifie ta connexion.'); }
    finally  { setLoading(false); }
  }

  function toggleCard(id) {
    setOwned(prev => ({...prev, [id]: !prev[id]}));
  }

  // ── Stats
  const ownedCount = cards.filter(c => owned[c.id]).length;
  const total      = cards.length || setInfo?.total || 0;
  const pct        = total ? Math.round(ownedCount / total * 100) : 0;

  const rarityStats = Object.entries(RARITY_CFG)
    .sort((a,b) => a[1].order - b[1].order)
    .map(([rarity, cfg]) => {
      const group  = cards.filter(c => c.rarity === rarity);
      const ownedG = group.filter(c => owned[c.id]);
      return { rarity, cfg, total: group.length, owned: ownedG.length };
    }).filter(r => r.total > 0);

  // ── Filtrage
  const RARITY_KEYS = ['Rare Holo','Rare','Uncommon','Common'];
  const filtered = cards.filter(c => {
    if (filter === 'owned')   return owned[c.id];
    if (filter === 'missing') return !owned[c.id];
    if (RARITY_KEYS.includes(filter)) return c.rarity === filter;
    return true;
  });

  // ── Couleur de bord selon type
  function typeColor(card) {
    return card.types?.[0] ? (TYPE_COLOR[card.types[0]] || '#94a3b8') : '#94a3b8';
  }

  return (
    <div className="fade-in space-y-4">

      {/* Titre */}
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-xl font-bold text-slate-800">🃏 Collection Pokémon</h2>
          <p className="text-xs text-slate-400 mt-0.5">Wizards of the Coast Block</p>
        </div>
        <button onClick={() => setZoom(z => !z)}
          className="text-xs text-slate-400 hover:text-indigo-500 border border-slate-200 rounded-lg px-2.5 py-1.5 hover:border-indigo-300 transition-colors">
          {zoom ? '🔍 Compact' : '🔎 Agrandi'}
        </button>
      </div>

      {/* Onglets sets */}
      <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1">
        {POKE_SETS.map(s => {
          const sc = cache[s.id]?.filter(c => owned[c.id]).length || 0;
          const isActive = activeSet === s.id;
          return (
            <button key={s.id}
              onClick={() => { setActiveSet(s.id); setFilter('all'); }}
              className={`flex-shrink-0 flex flex-col items-center px-3 py-2 rounded-xl text-xs font-semibold border transition-colors ${
                isActive
                  ? 'bg-indigo-600 text-white border-indigo-600 shadow-sm'
                  : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300'
              }`}>
              <span>{s.short}</span>
              <span className={`font-normal mt-0.5 ${isActive ? 'text-indigo-200' : 'text-slate-400'}`}>
                {sc}/{s.total}
              </span>
            </button>
          );
        })}
      </div>

      {/* Barre de progression globale */}
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
        <div className="flex items-center justify-between mb-2">
          <span className="font-semibold text-slate-700 text-sm">{setInfo?.name} · {setInfo?.year}</span>
          <span className="text-sm font-bold text-indigo-600">
            {ownedCount}<span className="text-slate-400 font-normal">/{total}</span>
            <span className="ml-1.5 text-xs bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full">{pct}%</span>
          </span>
        </div>
        {/* Barre globale */}
        <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden mb-3">
          <div className="h-full rounded-full transition-all duration-700 bg-gradient-to-r from-yellow-400 via-indigo-500 to-purple-600"
            style={{width:`${pct}%`}} />
        </div>
        {/* Stats par rareté */}
        {cards.length > 0 && (
          <div className="grid grid-cols-2 gap-x-4 gap-y-2">
            {rarityStats.map(({rarity, cfg, total: t, owned: o}) => (
              <div key={rarity} className="flex items-center gap-2">
                <span className="text-sm w-5 text-center flex-shrink-0">{cfg.symbol}</span>
                <div className="flex-1 min-w-0">
                  <div className="flex justify-between text-xs mb-0.5">
                    <span className="text-slate-600 truncate">{cfg.label}</span>
                    <span className="font-bold flex-shrink-0 ml-1" style={{color:cfg.color}}>{o}/{t}</span>
                  </div>
                  <div className="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                    <div className="h-full rounded-full transition-all duration-500"
                      style={{width:`${t ? Math.round(o/t*100) : 0}%`, background: cfg.color}} />
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      {/* Filtres */}
      <div className="flex gap-1.5 overflow-x-auto pb-1 -mx-1 px-1">
        {[
          {f:'all',       label:'Toutes'},
          {f:'owned',     label:'✅ Possédées'},
          {f:'missing',   label:'❌ Manquantes'},
          {f:'Rare Holo', label:'✨ Holo'},
          {f:'Rare',      label:'⭐ Rare'},
          {f:'Uncommon',  label:'🔷 Peu commun'},
          {f:'Common',    label:'○ Commun'},
        ].map(({f, label}) => (
          <button key={f} onClick={() => setFilter(f)}
            className={`flex-shrink-0 text-xs px-3 py-1.5 rounded-full border font-medium transition-colors whitespace-nowrap ${
              filter===f
                ? 'bg-indigo-600 text-white border-indigo-600'
                : 'bg-white border-slate-200 text-slate-600 hover:border-indigo-300'
            }`}>
            {label}
            {f !== 'all' && cards.length > 0 && (() => {
              const n = f==='owned' ? ownedCount
                : f==='missing' ? total-ownedCount
                : cards.filter(c=>c.rarity===f).length;
              return <span className="ml-1 opacity-60">({n})</span>;
            })()}
          </button>
        ))}
      </div>

      {/* Chargement */}
      {loading && (
        <div className="flex flex-col items-center justify-center py-16 gap-3 text-slate-400">
          <div className="text-5xl animate-bounce">🃏</div>
          <p className="text-sm">Chargement des cartes…</p>
        </div>
      )}

      {/* Erreur */}
      {error && !loading && (
        <div className="bg-rose-50 border border-rose-200 rounded-2xl p-4 text-sm text-rose-600 text-center space-y-2">
          <p>{error}</p>
          <button onClick={() => fetchCards(activeSet)}
            className="text-xs underline text-rose-500 hover:text-rose-700">Réessayer</button>
        </div>
      )}

      {/* Grille de cartes */}
      {!loading && !error && filtered.length > 0 && (
        <div className={`grid gap-2 ${zoom ? 'grid-cols-2' : 'grid-cols-3 sm:grid-cols-4'}`}>
          {filtered.map(card => {
            const isOwned = !!owned[card.id];
            const rarCfg  = RARITY_CFG[card.rarity] || {};
            const tc      = typeColor(card);
            return (
              <button key={card.id} onClick={() => toggleCard(card.id)}
                className="relative rounded-xl overflow-hidden text-left transition-all duration-200 active:scale-95"
                style={{
                  border: `2px solid ${isOwned ? tc : 'transparent'}`,
                  boxShadow: isOwned ? `0 0 14px ${tc}44, 0 2px 8px rgba(0,0,0,.1)` : '0 1px 3px rgba(0,0,0,.08)',
                  background: '#f8fafc',
                  outline: isOwned ? `3px solid ${tc}22` : 'none',
                  outlineOffset: '1px',
                }}>

                {/* Image carte */}
                <div className="relative" style={{paddingBottom:'139%'}}>
                  <img
                    src={card.images?.small}
                    alt={card.name}
                    loading="lazy"
                    draggable={false}
                    className="absolute inset-0 w-full h-full object-cover select-none"
                    style={{
                      filter: isOwned ? 'none' : 'grayscale(100%) brightness(0.45)',
                      transition: 'filter .2s',
                    }}
                  />
                  {/* Badge possédé */}
                  {isOwned && (
                    <div style={{position:'absolute',top:5,right:5,background:'rgba(0,0,0,.55)',borderRadius:'50%',width:22,height:22,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,backdropFilter:'blur(4px)'}}>
                      ✅
                    </div>
                  )}
                  {/* Numéro */}
                  <div style={{position:'absolute',bottom:5,left:5,background:'rgba(0,0,0,.6)',color:'#fff',fontSize:'9px',padding:'1px 5px',borderRadius:4,fontWeight:700,backdropFilter:'blur(2px)'}}>
                    {card.number}/{total}
                  </div>
                  {/* Rareté holo — effet brillant */}
                  {isOwned && card.rarity === 'Rare Holo' && (
                    <div style={{position:'absolute',inset:0,background:'linear-gradient(135deg,rgba(255,215,0,.15) 0%,transparent 50%,rgba(255,100,200,.1) 100%)',pointerEvents:'none'}} />
                  )}
                </div>

                {/* Nom + rareté */}
                <div className="px-1.5 py-1.5" style={{background: isOwned ? `${tc}18` : '#f1f5f9'}}>
                  <p className="text-xs font-semibold text-slate-800 truncate leading-tight">{card.name}</p>
                  <p className="text-[10px] leading-tight mt-0.5" style={{color: rarCfg.color || '#94a3b8'}}>
                    {rarCfg.symbol} {rarCfg.label || card.rarity}
                  </p>
                </div>
              </button>
            );
          })}
        </div>
      )}

      {/* Aucun résultat */}
      {!loading && !error && filtered.length === 0 && cards.length > 0 && (
        <div className="text-center py-10 text-slate-400 space-y-2">
          <p className="text-3xl">🔍</p>
          <p className="text-sm">Aucune carte pour ce filtre</p>
          <button onClick={() => setFilter('all')} className="text-xs text-indigo-500 hover:underline">Voir toutes →</button>
        </div>
      )}

      {/* Tableau récapitulatif */}
      {!loading && cards.length > 0 && (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
          <div className="px-4 pt-4 pb-1">
            <h3 className="font-semibold text-slate-700">📊 Récapitulatif — {setInfo?.name}</h3>
          </div>
          <table className="w-full text-sm mt-2">
            <thead>
              <tr className="bg-slate-50 border-y border-slate-100 text-xs text-slate-500 font-medium">
                <th className="text-left px-4 py-2">Rareté</th>
                <th className="text-center px-3 py-2">Possédées</th>
                <th className="text-center px-3 py-2">Total</th>
                <th className="px-4 py-2 text-right">Progression</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-slate-50">
              {rarityStats.map(({rarity, cfg, total: t, owned: o}) => {
                const p = t ? Math.round(o/t*100) : 0;
                return (
                  <tr key={rarity} className="hover:bg-slate-50 transition-colors">
                    <td className="px-4 py-2.5">
                      <span className="flex items-center gap-2">
                        <span className="text-base">{cfg.symbol}</span>
                        <span className="font-medium text-slate-700">{cfg.label}</span>
                      </span>
                    </td>
                    <td className="text-center px-3 py-2.5 font-bold" style={{color: cfg.color}}>{o}</td>
                    <td className="text-center px-3 py-2.5 text-slate-400">{t}</td>
                    <td className="px-4 py-2.5">
                      <div className="flex items-center gap-2 justify-end">
                        <div className="w-16 bg-slate-100 rounded-full h-1.5 overflow-hidden">
                          <div className="h-full rounded-full transition-all" style={{width:`${p}%`, background: cfg.color}} />
                        </div>
                        <span className="text-xs font-semibold w-8 text-right" style={{color: cfg.color}}>{p}%</span>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr className="bg-indigo-50 border-t-2 border-indigo-100">
                <td className="px-4 py-3 font-bold text-slate-800">🃏 Total</td>
                <td className="text-center px-3 py-3 font-bold text-indigo-600 text-base">{ownedCount}</td>
                <td className="text-center px-3 py-3 font-semibold text-slate-500">{total}</td>
                <td className="px-4 py-3">
                  <div className="flex items-center gap-2 justify-end">
                    <div className="w-16 bg-indigo-100 rounded-full h-2 overflow-hidden">
                      <div className="h-full rounded-full bg-indigo-500 transition-all" style={{width:`${pct}%`}} />
                    </div>
                    <span className="text-sm font-bold text-indigo-600 w-8 text-right">{pct}%</span>
                  </div>
                </td>
              </tr>
            </tfoot>
          </table>
        </div>
      )}
    </div>
  );
}

function SportTracker({ sport, setSport }) {
  const sessions   = sport.sessions   || [];
  const weeklyGoal = sport.weeklyGoal || 3;
  const circuits   = sport.circuits   || DEFAULT_CIRCUITS;

  const [showGoalEdit, setShowGoalEdit]     = useState(false);
  const [goalInput, setGoalInput]           = useState(weeklyGoal);
  const [expanded, setExpanded]             = useState(null);
  const [showHistory, setShowHistory]       = useState(false);
  const [showCircuitModal, setShowCircuitModal] = useState(false);
  const [editingCircuitId, setEditingCircuitId] = useState(null);
  const COLORS = ['#6366f1','#ef4444','#f59e0b','#22c55e','#06b6d4','#ec4899','#8b5cf6','#f97316'];
  const emptyForm = () => ({ name:'', duration:20, color:'#6366f1', exercises:[{name:'',sets:3,reps:'10'}] });
  const [circuitForm, setCircuitForm] = useState(emptyForm());

  // Sessions de la semaine en cours
  const getMonday = d => { const r=new Date(d); const day=r.getDay(); r.setDate(r.getDate()-day+(day===0?-6:1)); r.setHours(0,0,0,0); return r; };
  const monday = getMonday(new Date());
  const sunday = new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  const thisWeek = sessions.filter(s => { const d=new Date(s.date); return d>=monday && d<=sunday; });
  const pct = Math.min(100, Math.round((thisWeek.length / weeklyGoal) * 100));
  const done = thisWeek.length >= weeklyGoal;

  function logSession(circuit) {
    setSport(p => ({
      ...p,
      sessions: [...(p.sessions||[]), { id:uid(), circuitId:circuit.id, circuitName:circuit.name, date:new Date().toISOString() }]
    }));
  }

  function deleteSession(id) {
    setSport(p => ({ ...p, sessions: (p.sessions||[]).filter(s => s.id !== id) }));
  }

  function openNewCircuit() {
    setEditingCircuitId(null);
    setCircuitForm(emptyForm());
    setShowCircuitModal(true);
  }

  function openEditCircuit(c, e) {
    e.stopPropagation();
    setEditingCircuitId(c.id);
    setCircuitForm({ name:c.name, duration:c.duration, color:c.color, exercises:c.exercises.map(ex=>({...ex})) });
    setShowCircuitModal(true);
  }

  function saveCircuit() {
    if (!circuitForm.name.trim()) return;
    const exercises = circuitForm.exercises.filter(ex => ex.name.trim());
    if (!exercises.length) return;
    setSport(p => {
      const list = p.circuits || DEFAULT_CIRCUITS;
      if (editingCircuitId) {
        return { ...p, circuits: list.map(c => c.id === editingCircuitId ? {...c, ...circuitForm, exercises} : c) };
      } else {
        return { ...p, circuits: [...list, { id:uid(), ...circuitForm, exercises }] };
      }
    });
    setShowCircuitModal(false);
  }

  function deleteCircuit(id, e) {
    e.stopPropagation();
    setSport(p => ({ ...p, circuits: (p.circuits||DEFAULT_CIRCUITS).filter(c => c.id !== id) }));
    if (expanded === id) setExpanded(null);
  }

  function updateExercise(i, field, val) {
    setCircuitForm(p => { const ex=[...p.exercises]; ex[i]={...ex[i],[field]:val}; return {...p,exercises:ex}; });
  }
  function addExercise() {
    setCircuitForm(p => ({...p, exercises:[...p.exercises,{name:'',sets:3,reps:'10'}]}));
  }
  function removeExercise(i) {
    setCircuitForm(p => ({...p, exercises:p.exercises.filter((_,idx)=>idx!==i)}));
  }

  function saveGoal() {
    const g = Math.max(1, Math.min(7, parseInt(goalInput)||3));
    setSport(p => ({ ...p, weeklyGoal: g }));
    setShowGoalEdit(false);
  }

  // Grouper l'historique par semaine
  const byWeek = {};
  [...sessions].reverse().forEach(s => {
    const m = getMonday(new Date(s.date));
    const key = m.toISOString();
    if (!byWeek[key]) byWeek[key] = { monday: m, sessions: [] };
    byWeek[key].sessions.push(s);
  });
  const weeks = Object.values(byWeek).slice(0, 8);

  const fmtDay = d => new Date(d).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  const fmtWeek = m => { const e=new Date(m); e.setDate(m.getDate()+6); return `${m.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – ${e.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}`; };

  return (
    <div className="fade-in space-y-5">
      <h2 className="text-xl font-bold text-slate-800">🏋️ Mon Sport</h2>

      {/* Objectif semaine */}
      <div className={`rounded-2xl p-5 shadow-sm border ${done ? 'bg-green-50 border-green-200' : 'bg-white border-slate-100'}`}>
        <div className="flex items-center justify-between mb-3">
          <div>
            <p className="font-semibold text-slate-700">Objectif de la semaine</p>
            <p className="text-xs text-slate-400 mt-0.5">
              {monday.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})} – {sunday.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}
            </p>
          </div>
          <div className="text-right">
            <span className={`text-2xl font-bold ${done ? 'text-green-600' : 'text-indigo-600'}`}>{thisWeek.length}</span>
            <span className="text-slate-400 text-lg font-medium">/{weeklyGoal}</span>
            <p className="text-xs text-slate-400 mt-0.5">séances</p>
          </div>
        </div>
        <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
          <div className="h-3 rounded-full transition-all duration-500"

                    <span className="text-xs bg-indigo-50 text-indigo-500 px-2 py-0.5 rounded-full">{w.sessions.length} séance{w.sessions.length>1?'s':''}</span>

        <div className="space-y-3">

            <label className="block text-sm font-medium text-slate-700 mb-1">Nom du circuit *</label>
            <input value={circuitForm.name} onChange={e => setCircuitForm(p=>({...p,name:e.target.value}))}

            <div className="flex-1">

const PROFILES = {
  damien:  { name: 'Damien',  avatar: '👨', hiddenTabs: [] },
  jessica: { name: 'Jessica', avatar: '👩', hiddenTabs: ['finance', 'pokemon', 'sport'] },
};

// ── Idées Cadeaux ─────────────────────────────────────────────────────────────
function GiftIdeas({ gifts, setGifts, settings, profile }) {
  const [filterPerson, setFilterPerson] = useState('Tous');
  const [showModal, setShowModal]       = useState(false);
  const [editing, setEditing]           = useState(null);
  const [form, setForm] = useState({ name:'', forPerson:'', price:'', link:'', note:'', secret:false });

  const profileName = (PROFILES[profile] || PROFILES.damien).name;
  const persons = ['Tous', settings.myName||'Damien', settings.partnerName||'Jessica', settings.childName||'Gabriella', 'Autre'];

  // Masquer les cadeaux secrets pour le destinataire
  const visibleGifts = gifts.filter(g => {
    if (g.secret && g.forPerson === profileName) return false;
    if (filterPerson !== 'Tous' && g.forPerson !== filterPerson) return false;
    return true;
  });

  const boughtCount  = visibleGifts.filter(g => g.bought).length;
  const totalCount   = visibleGifts.length;

  function openAdd() {
    setEditing(null);
    setForm({ name:'', forPerson: persons[1], price:'', link:'', note:'', secret:false });
    setShowModal(true);
  }
  function openEdit(g) {
    setEditing(g.id);
    setForm({ name:g.name, forPerson:g.forPerson, price:g.price||'', link:g.link||'', note:g.note||'', secret:g.secret||false });
    setShowModal(true);
  }
  function save() {
    if (!form.name.trim()) return;
    if (editing) {
      setGifts(p => p.map(g => g.id === editing ? {...g, ...form} : g));
    } else {
      setGifts(p => [...p, { id:uid(), ...form, bought:false, addedBy:profileName, createdAt:Date.now() }]);
    }
    setShowModal(false);
  }
  function toggleBought(id) { setGifts(p => p.map(g => g.id === id ? {...g, bought:!g.bought} : g)); }
  function remove(id)        { setGifts(p => p.filter(g => g.id !== id)); }

  return (
    <div className="fade-in space-y-4">
      <div className="flex items-center justify-between">
        <div>
          <h2 className="text-xl font-bold text-slate-800">🎁 Idées cadeaux</h2>
          {totalCount > 0 && <p className="text-xs text-slate-400 mt-0.5">{boughtCount}/{totalCount} achetés</p>}
        </div>
        <button onClick={openAdd} className="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-medium px-4 py-2 rounded-xl transition-colors">+ Ajouter</button>
      </div>

      {/* Filtre par personne */}
      <div className="flex gap-2 overflow-x-auto scrollbar-hide pb-1">
        {persons.map(p => (
          <button key={p} onClick={() => setFilterPerson(p)}
            className={`flex-shrink-0 px-3 py-1.5 rounded-full text-sm font-medium transition-colors ${filterPerson===p ? 'bg-indigo-500 text-white' : 'bg-white text-slate-600 border border-slate-200 hover:border-indigo-300'}`}>
            {p}
          </button>
        ))}
      </div>

      {/* Liste */}
      {visibleGifts.length === 0 ? (
        <div className="text-center py-14 text-slate-400">
          <div className="text-5xl mb-3">🎁</div>
          <p className="text-sm">Aucune idée cadeau pour l'instant</p>
          <button onClick={openAdd} className="mt-3 text-indigo-500 text-sm hover:underline">Ajouter une idée →</button>
        </div>
      ) : (
        <div className="space-y-3">
          {visibleGifts.map(g => (
            <div key={g.id} className={`bg-white rounded-2xl p-4 shadow-sm border transition-all ${g.bought ? 'border-green-200 bg-green-50/30' : 'border-slate-100'}`}>
              <div className="flex items-start gap-3">
                {/* Bouton cocher */}
                <button onClick={() => toggleBought(g.id)}
                  className={`mt-0.5 w-6 h-6 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-all ${g.bought ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 hover:border-green-400'}`}>
                  {g.bought && <span className="text-xs font-bold">✓</span>}
                </button>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 flex-wrap">
                    <span className={`font-medium text-slate-800 ${g.bought ? 'line-through text-slate-400' : ''}`}>{g.name}</span>
                    {g.secret && <span className="text-xs bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded-full">🔒 Secret</span>}
                    {g.bought && <span className="text-xs bg-green-100 text-green-600 px-1.5 py-0.5 rounded-full">✅ Acheté</span>}
                  </div>
                  <div className="flex items-center gap-2 mt-1 flex-wrap">
                    <span className="text-xs text-slate-500">Pour <strong>{g.forPerson}</strong></span>
                    {g.price && <span className="text-xs bg-amber-50 text-amber-600 px-2 py-0.5 rounded-full border border-amber-100">~{g.price} €</span>}
                    {g.link && <a href={g.link} target="_blank" rel="noopener noreferrer" className="text-xs text-indigo-500 hover:underline">🔗 Voir</a>}
                  </div>
                  {g.note && <p className="text-xs text-slate-400 mt-1 italic">{g.note}</p>}
                </div>
                <div className="flex gap-1 flex-shrink-0">
                  <button onClick={() => openEdit(g)} className="p-1.5 text-slate-400 hover:text-indigo-500 hover:bg-indigo-50 rounded-lg transition-colors text-sm">✏️</button>
                  <button onClick={() => remove(g.id)} className="p-1.5 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors text-sm">🗑️</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Modal */}
      <Modal open={showModal} onClose={() => setShowModal(false)} title={editing ? '✏️ Modifier l\'idée' : '🎁 Nouvelle idée cadeau'}>
        <div className="space-y-3">
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Idée cadeau *</label>
            <input value={form.name} onChange={e => setForm(p => ({...p, name:e.target.value}))}
              placeholder="Ex : Nintendo Switch, livre, parfum…"
              className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Pour qui *</label>
            <select value={form.forPerson} onChange={e => setForm(p => ({...p, forPerson:e.target.value}))}
              className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300">
              {persons.slice(1).map(p => <option key={p} value={p}>{p}</option>)}
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Prix estimé (€)</label>
            <input value={form.price} onChange={e => setForm(p => ({...p, price:e.target.value}))}
              placeholder="Ex : 50" type="number" min="0"
              className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Lien (optionnel)</label>
            <input value={form.link} onChange={e => setForm(p => ({...p, link:e.target.value}))}
              placeholder="https://..."
              className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300" />
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Note</label>
            <textarea value={form.note} onChange={e => setForm(p => ({...p, note:e.target.value}))}
              placeholder="Taille, couleur, modèle…" rows={2}
              className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 resize-none" />
          </div>
          <label className="flex items-center gap-2 cursor-pointer select-none p-3 bg-purple-50 rounded-xl border border-purple-100">
            <input type="checkbox" checked={form.secret} onChange={e => setForm(p => ({...p, secret:e.target.checked}))} className="w-4 h-4 rounded" />
            <div>
              <span className="text-sm font-medium text-purple-700">🔒 Cadeau secret</span>
              <p className="text-xs text-purple-500">Caché sur le profil du destinataire</p>
            </div>
          </label>
          <div className="flex gap-2 pt-1">
            <button onClick={save} className="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-2.5 rounded-xl transition-colors">
              {editing ? 'Modifier' : 'Ajouter 🎁'}
            </button>
            <button onClick={() => setShowModal(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition-colors">
              Annuler
            </button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

        <div className="fixed inset-0 flex items-center justify-center bg-black/40 backdrop-blur-sm" style={{zIndex:1000}} onClick={() => setShowProfileMenu(false)}>
          <div className="bg-white rounded-2xl shadow-2xl p-6 w-72 fade-in" onClick={e => e.stopPropagation()}>
            <h3 className="font-semibold text-slate-800 text-lg mb-4 text-center">Changer de profil</h3>
            <div className="grid grid-cols-2 gap-3">
              {Object.entries(PROFILES).map(([key, cfg]) => (
                <button key={key} onClick={() => { setProfile(key); setShowProfileMenu(false); }}
                  className={`flex flex-col items-center gap-2 p-4 rounded-xl border-2 transition-all ${profile === key ? 'border-indigo-400 bg-indigo-50 text-indigo-700' : 'border-slate-100 hover:border-indigo-200 hover:bg-slate-50 text-slate-700'}`}>
                  <span className="text-3xl">{cfg.avatar}</span>
                  <span className="font-medium text-sm">{cfg.name}</span>
                  {profile === key && <span className="text-xs text-indigo-500">✓ Actif</span>}
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <header className="bg-white border-b border-slate-100 sticky top-0 z-40">
        <div className="px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <img src="logo.png" alt="DasilvLife" style={{height:'72px', width:'auto'}} />
            <span title={online ? 'Synchronisé' : 'Hors ligne'} className="w-2 h-2 rounded-full inline-block flex-shrink-0" style={{backgroundColor: online ? '#22c55e' : '#f59e0b'}} />
          </div>
          <div className="flex items-center gap-1">
            <button onClick={() => setShowProfileMenu(true)}
              className="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl hover:bg-slate-100 text-slate-600 text-sm font-medium transition-colors" title="Changer de profil">
              <span>{profileCfg.avatar}</span>
              <span>{profileCfg.name}</span>
            </button>
            <button onClick={() => setDarkMode(p => !p)} className="p-2 rounded-xl hover:bg-slate-100 text-slate-500 text-lg" title="Mode sombre">{darkMode ? '☀️' : '🌙'}</button>
            <button onClick={() => setShowSettings(true)} className="p-2 rounded-xl hover:bg-slate-100 text-slate-500 text-lg" title="Paramètres">⚙️</button>
          </div>
        </div>
        <div className="flex flex-wrap border-t border-slate-100">
          {tabs.filter(t => !t.hidden && !profileCfg.hiddenTabs.includes(t.id)).map(t => (
            <button key={t.id} onClick={() => setActiveTab(t.id)} style={{width:'20%'}}
              className={`flex flex-col items-center gap-0.5 py-1.5 text-xs font-medium transition-colors ${activeTab===t.id ? 'tab-active text-indigo-600 bg-indigo-50/50' : 'text-slate-500 hover:text-slate-700 hover:bg-slate-50'}`}>
              <span className="text-base">{t.icon}</span>
              <span className="text-[10px] leading-tight">{t.label}</span>
            </button>
          ))}
        </div>
      </header>

      {/* Content */}
      <main className="flex-1 p-4 pb-8">
        {activeTab === 'dashboard' && <Dashboard meals={meals} crecheSchedule={crecheSchedule} setCrecheSchedule={setCrecheSchedule} trips={trips} shoppingItems={shoppingItems} settings={settings} setTab={setActiveTab} photos={photos} anniversaires={anniversaires} notes={notes} domotiqueConfig={domotiqueConfig} domotiqueStates={domotiqueStates} onOpenSettings={() => setShowSettings(true)} profile={profile} sport={sport} />}
        {activeTab === 'meals' && <MealPlanner meals={meals} setMeals={setMeals} shoppingItems={shoppingItems} setShoppingItems={setShoppingItems} />}
        {activeTab === 'shopping' && <ShoppingList shoppingItems={shoppingItems} setShoppingItems={setShoppingItems} />}
        {activeTab === 'creche' && <CrecheSchedule crecheSchedule={crecheSchedule} setCrecheSchedule={setCrecheSchedule} settings={settings} trips={trips} />}
        {activeTab === 'trips' && <TripPlanner trips={trips} setTrips={setTrips} />}
        {activeTab === 'notes' && <PenseBete notes={notes} setNotes={setNotes} />}
        {activeTab === 'finance' && <Finance />}
        {activeTab === 'pokemon' && <PokemonCollection />}
        {activeTab === 'gifts' && <GiftIdeas gifts={gifts} setGifts={setGifts} settings={settings} profile={profile} />}
        {activeTab === 'sport' && <SportTracker sport={sport} setSport={setSport} />}
      </main>

      {/* Settings modal */}
      <Modal open={showSettings} onClose={() => setShowSettings(false)} title="⚙️ Paramètres">
        <Settings settings={settings} setSettings={setSettings} onClose={() => setShowSettings(false)} anniversaires={anniversaires} setAnniversaires={setAnniversaires} />
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
